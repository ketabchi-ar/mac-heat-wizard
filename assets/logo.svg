<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#softShadow)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Inner Chip Square -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="url(#chipGrad)" stroke="rgba(56,189,248,0.25)" stroke-width="2.5"/>

  <!-- Chip Pin Accents -->
  <g stroke="rgba(56,189,248,0.4)" stroke-width="3" stroke-linecap="round">
    <!-- Top Pins -->
    <line x1="160" y1="84" x2="160" y2="96"/>
    <line x1="208" y1="84" x2="208" y2="96"/>
    <line x1="256" y1="84" x2="256" y2="96"/>
    <line x1="304" y1="84" x2="304" y2="96"/>
    <line x1="352" y1="84" x2="352" y2="96"/>
    <!-- Bottom Pins -->
    <line x1="160" y1="416" x2="160" y2="428"/>
    <line x1="208" y1="416" x2="208" y2="428"/>
    <line x1="256" y1="416" x2="256" y2="428"/>
    <line x1="304" y1="416" x2="304" y2="428"/>
    <line x1="352" y1="416" x2="352" y2="428"/>
  </g>

  <!-- M3 Branding Text inside chip -->
  <text x="256" y="380" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="28" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="4">M3 CORE</text>

  <!-- Core Circuit Heat Tracks -->
  <path d="M 136 256 H 180 L 204 220 H 224" stroke="rgba(56,189,248,0.3)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 376 256 H 332 L 308 292 H 288" stroke="rgba(244,63,94,0.3)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Flame Core (Stylized Guardian Flame) -->
  <g filter="url(#neonGlow)">
    <!-- Outer Flame -->
    <path d="M 256 140 C 220 190, 180 240, 180 295 C 180 340, 214 365, 256 365 C 298 365, 332 340, 332 295 C 332 240, 292 190, 256 140 Z" fill="url(#flameGrad)" opacity="0.95"/>
    
    <!-- Inner Core Flame -->
    <path d="M 256 210 C 235 245, 215 275, 215 310 C 215 338, 233 355, 256 355 C 279 355, 297 338, 297 310 C 297 275, 277 245, 256 210 Z" fill="#ffffff" opacity="0.85"/>

    <!-- Dynamic Spark / Energy Wave -->
    <circle cx="256" cy="305" r="14" fill="#38bdf8"/>
    <circle cx="256" cy="305" r="7" fill="#ffffff"/>
  </g>

  <!-- Subtle Top Highlight Rim -->
  <path d="M 136 36 Q 256 32 376 36" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none"/>
</svg>