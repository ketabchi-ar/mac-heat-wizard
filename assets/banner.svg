<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background with Tech Grid Lines -->
  <rect width="1280" height="640" fill="url(#bannerBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="280" cy="320" r="240" fill="#38bdf8" opacity="0.08" filter="url(#glowEffect)"/>
  <circle cx="1060" cy="200" r="260" fill="#fb7185" opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Left: Hero App Icon / Core Visual -->
  <g transform="translate(110, 140)">
    <!-- Squircle Frame -->
    <rect x="0" y="0" width="360" height="360" rx="84" fill="#131826" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
    
    <!-- Inner Chip Plate -->
    <rect x="50" y="50" width="260" height="260" rx="38" fill="#0f172a" stroke="rgba(56,189,248,0.3)" stroke-width="2"/>
    
    <!-- Pins -->
    <g stroke="rgba(56,189,248,0.4)" stroke-width="3" stroke-linecap="round">
      <line x1="100" y1="40" x2="100" y2="50"/><line x1="140" y1="40" x2="140" y2="50"/>
      <line x1="180" y1="40" x2="180" y2="50"/><line x1="220" y1="40" x2="220" y2="50"/><line x1="260" y1="40" x2="260" y2="50"/>
      <line x1="100" y1="310" x2="100" y2="320"/><line x1="140" y1="310" x2="140" y2="50"/><line x1="180" y1="310" x2="180" y2="320"/>
      <line x1="220" y1="310" x2="220" y2="320"/><line x1="260" y1="310" x2="260" y2="320"/>
    </g>

    <!-- Glowing Flame -->
    <g filter="url(#glowEffect)">
      <path d="M 180 85 C 148 130, 115 170, 115 215 C 115 255, 142 278, 180 278 C 218 278, 245 255, 245 215 C 245 170, 212 130, 180 85 Z" fill="url(#flameGrad)" opacity="0.95"/>
      <path d="M 180 145 C 162 175, 145 200, 145 230 C 145 252, 160 268, 180 268 C 200 268, 215 252, 215 230 C 215 200, 198 175, 180 145 Z" fill="#ffffff" opacity="0.85"/>
      <circle cx="180" cy="225" r="10" fill="#38bdf8"/>
    </g>

    <text x="180" y="295" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="20" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="4">M3 CHIP</text>
  </g>

  <!-- Right: Titles, Features & Badges -->
  <g transform="translate(540, 150)">
    <!-- Small Category Eyebrow -->
    <text x="0" y="20" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="3">MACOS 27 FROSTED GLASS SENTINEL</text>

    <!-- Main Title English -->
    <text x="0" y="80" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">HeatWizard</text>
    
    <!-- Main Title Persian -->
    <text x="315" y="80" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="34" font-weight="700" fill="url(#neonAccent)">مرکز مهار حرارت مک</text>

    <!-- Subtitle English -->
    <text x="0" y="125" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="19" font-weight="500" fill="#94a3b8">
      Pure Swift &amp; IOKit Thermal Sentinel for Apple Silicon M-Series
    </text>

    <!-- Subtitle Persian -->
    <text x="0" y="160" font-family="'Vazirmatn', -apple-system, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" direction="rtl">
      پایشگر زنده سنسورهای دمای هسته M3، مهار پردازش‌های سنگین و مدیر رم تب‌های مرورگر
    </text>

    <!-- Feature Pills Grid -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="36" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
      <text x="90" y="23" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡️ 100% Zero-Sudo</text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="180" height="36" rx="10" fill="rgba(52, 211, 153, 0.12)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5"/>
      <text x="285" y="23" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">🍏 Apple Silicon M3</text>

      <!-- Pill 3 -->
      <rect x="390" y="0" width="180" height="36" rx="10" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.5"/>
      <text x="480" y="23" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#fb7185" text-anchor="middle">🔥 Menu Bar Live Extra</text>

      <!-- Row 2 -->
      <!-- Pill 4 -->
      <rect x="0" y="48" width="180" height="36" rx="10" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
      <text x="90" y="71" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">🌐 Browser RAM Killer</text>

      <!-- Pill 5 -->
      <rect x="195" y="48" width="180" height="36" rx="10" fill="rgba(251, 146, 60, 0.12)" stroke="rgba(251, 146, 60, 0.3)" stroke-width="1.5"/>
      <text x="285" y="71" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle">☀️ Light &amp; Dark Mode</text>

      <!-- Pill 6 -->
      <rect x="390" y="48" width="180" height="36" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
      <text x="480" y="71" font-family="-apple-system, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🇮🇷 دوزبانه (فارسی/EN)</text>
    </g>

    <!-- Bottom Line Note -->
    <text x="0" y="325" font-family="'SF Mono', monospace" font-size="12" fill="#64748b">
      curl -fsSL https://raw.githubusercontent.com/ketabchi-ar/mac-heat-wizard/main/install.sh | bash
    </text>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="634" width="1280" height="6" fill="url(#neonAccent)"/>
</svg>